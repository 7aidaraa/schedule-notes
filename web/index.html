<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>طلبات المعلمين</title>
<style>
  :root { --bg:#f4f6f8; --card:#fff; --ink:#1d2733; --mute:#6b7785; --line:#dde3ea; --pri:#1f6feb; --ok:#1a7f37; --err:#c62828; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.6 "Segoe UI", Tahoma, sans-serif; }
  main { max-width:760px; margin:0 auto; padding:24px 16px; }
  h1 { font-size:22px; margin:0 0 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:12px; }
  label { display:block; font-weight:600; margin:12px 0 4px; }
  input, textarea { width:100%; padding:10px; border:1px solid var(--line); border-radius:8px; font:inherit; }
  textarea { min-height:90px; resize:vertical; }
  button { padding:10px 18px; border:0; border-radius:8px; background:var(--pri); color:#fff; font:inherit; cursor:pointer; }
  button.ghost { background:transparent; color:var(--pri); border:1px solid var(--pri); }
  button.ok { background:var(--ok); }
  button:disabled { opacity:.6; cursor:wait; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:10px; }
  .msg { margin-top:10px; min-height:1.6em; }
  .msg.err { color:var(--err); } .msg.ok { color:var(--ok); }
  .meta { color:var(--mute); font-size:14px; }
  .done { opacity:.65; border-color:var(--ok); }
  .badge { display:inline-block; padding:2px 10px; border-radius:99px; font-size:13px; background:#fff3cd; }
  .done .badge { background:#d1f2dc; }
  .field b { color:var(--mute); font-weight:600; }
  .field p { margin:2px 0 8px; white-space:pre-wrap; }
  .preview img { max-width:100%; border-radius:8px; margin-top:8px; }
  .hidden { display:none; }
  .seg { display:inline-flex; margin-top:14px; border:1px solid var(--pri); border-radius:8px; overflow:hidden; }
  .seg label { margin:0; font-weight:600; }
  .seg input { position:absolute; opacity:0; width:auto; }
  .seg span { display:block; padding:8px 20px; color:var(--pri); cursor:pointer; }
  .seg input:checked + span { background:var(--pri); color:#fff; }
  .seg input:focus-visible + span { outline:2px solid var(--ink); outline-offset:-4px; }
  .item h2 { font-size:17px; margin:0; }
  .item .file { display:none; }
  .head .item .file { display:block; }
  a { color:var(--pri); }
</style>
</head>
<body>
<main>
  <h1>طلبات المعلمين</h1>

  <section id="login" class="card">
    <label for="pass">كلمة السر</label>
    <input id="pass" type="password" autocomplete="off">
    <div class="row"><button id="loginBtn">دخول</button></div>
    <div id="loginMsg" class="msg"></div>
  </section>

  <section id="teacher" class="hidden">
    <div class="card">
      <label for="dept">القسم العلمي</label>
      <input id="dept" list="deptList" maxlength="80" autocomplete="off" placeholder="اختر من القائمة أو اكتب">
      <datalist id="deptList"></datalist>
      <label for="name">الاسم</label>
      <input id="name" list="nameList" maxlength="120" autocomplete="off" placeholder="اختر من القائمة أو اكتب">
      <datalist id="nameList"></datalist>
      <div class="seg" role="radiogroup" aria-label="الصفة">
        <label><input type="radio" name="kind" value="teacher" checked><span>معلم</span></label>
        <label><input type="radio" name="kind" value="head"><span>رئيس قسم</span></label>
      </div>
    </div>
    <div id="items"></div>
    <div class="card">
      <button id="addBtn" class="ghost" type="button">+ إضافة طلب آخر</button>
      <label for="phone">رقم الهاتف</label>
      <input id="phone" type="tel" inputmode="numeric" maxlength="16" dir="ltr" placeholder="9xxxxxxx">
      <div class="row"><button id="sendBtn">إرسال</button></div>
      <div id="sendMsg" class="msg"></div>
    </div>
  </section>

  <section id="admin" class="hidden">
    <div class="row" style="margin-bottom:12px">
      <button id="refreshBtn" class="ghost">تحديث</button>
      <label style="margin:0;font-weight:400"><input id="hideDone" type="checkbox" style="width:auto"> إخفاء المنجزة</label>
      <span id="count" class="meta"></span>
    </div>
    <div id="list"></div>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
