<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  :root { --bg:#f4f6f8; --card:#fff; --ink:#1d2733; --mute:#6b7785; --line:#dde3ea; --pri:#1f6feb; --ok:#1a7f37; --err:#c62828; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.6 "Segoe UI", Tahoma, sans-serif; }
  main { max-width:760px; margin:0 auto; padding:24px 16px; }
  h1 { font-size:22px; margin:0 0 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:12px; }
  label { display:block; font-weight:600; margin:12px 0 4px; }
  input, textarea { width:100%; padding:10px; border:1px solid var(--line); border-radius:8px; font:inherit; }
  textarea { min-height:90px; resize:vertical; }
  button { padding:10px 18px; border:0; border-radius:8px; background:var(--pri); color:#fff; font:inherit; cursor:pointer; }
  button.ghost { background:transparent; color:var(--pri); border:1px solid var(--pri); }
  button.ok { background:var(--ok); }
  button:disabled { opacity:.6; cursor:wait; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:10px; }
  .msg { margin-top:10px; min-height:1.6em; }
  .msg.err { color:var(--err); } .msg.ok { color:var(--ok); }
  .meta { color:var(--mute); font-size:14px; }
  .done { opacity:.65; border-color:var(--ok); }
  .badge { display:inline-block; padding:2px 10px; border-radius:99px; font-size:13px; background:#fff3cd; }
  .done .badge { background:#d1f2dc; }
  .field b { color:var(--mute); font-weight:600; }
  .field p { margin:2px 0 8px; white-space:pre-wrap; }
  .preview img { max-width:100%; border-radius:8px; margin-top:8px; }
  .hidden { display:none; }
  a { color:var(--pri); }
</style>
</head>
<body>
<main>
  <h1>طلبات المعلمين</h1>

  <section id="login" class="card">
    <label for="pass">كلمة السر</label>
    <input id="pass" type="password" autocomplete="off">
    <div class="row"><button id="loginBtn">دخول</button></div>
    <div id="loginMsg" class="msg"></div>
  </section>

  <section id="teacher" class="card hidden">
    <label for="name">الاسم الرباعي</label>
    <input id="name" maxlength="120">
    <label for="request">الطلب</label>
    <textarea id="request" maxlength="3000"></textarea>
    <label for="reason">سبب الطلب</label>
    <textarea id="reason" maxlength="3000"></textarea>
    <label for="file">مرفق (اختياري): PDF أو صورة، حتى 10 ميغابايت</label>
    <input id="file" type="file" accept="application/pdf,image/*">
    <div class="row"><button id="sendBtn">إرسال الطلب</button></div>
    <div id="sendMsg" class="msg"></div>
  </section>

  <section id="admin" class="hidden">
    <div class="row" style="margin-bottom:12px">
      <button id="refreshBtn" class="ghost">تحديث</button>
      <label style="margin:0;font-weight:400"><input id="hideDone" type="checkbox" style="width:auto"> إخفاء المنجزة</label>
      <span id="count" class="meta"></span>
    </div>
    <div id="list"></div>
  </section>
</main>

<script>
  let PASS = '';
  let ROWS = [];
  const $ = id => document.getElementById(id);
  const MAX = 10 * 1024 * 1024;

  function call(fn, ...args) {
    return new Promise((res, rej) =>
      google.script.run.withSuccessHandler(res).withFailureHandler(e => rej(e.message || e))[fn](...args));
  }
  function msg(el, text, kind) { el.textContent = text; el.className = 'msg ' + (kind || ''); }
  function el(tag, props, ...kids) {
    const n = Object.assign(document.createElement(tag), props || {});
    kids.forEach(k => k && n.append(k));
    return n;
  }

  // ---- Login ----
  $('loginBtn').onclick = async () => {
    const btn = $('loginBtn'); btn.disabled = true;
    try {
      const role = await call('login', $('pass').value);
      PASS = $('pass').value;
      $('login').classList.add('hidden');
      $(role).classList.remove('hidden');
      if (role === 'admin') loadList();
    } catch (e) { msg($('loginMsg'), e, 'err'); }
    btn.disabled = false;
  };
  $('pass').onkeydown = e => { if (e.key === 'Enter') $('loginBtn').click(); };

  // ---- Teacher ----
  function readFile(f) {
    return new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res(String(r.result).split(',')[1]);
      r.onerror = () => rej('تعذرت قراءة الملف');
      r.readAsDataURL(f);
    });
  }

  $('sendBtn').onclick = async () => {
    const out = $('sendMsg'), btn = $('sendBtn');
    const data = { name: $('name').value.trim(), request: $('request').value.trim(), reason: $('reason').value.trim() };
    if (!data.name || !data.request || !data.reason) return msg(out, 'جميع الحقول مطلوبة', 'err');
    const f = $('file').files[0];
    if (f) {
      if (f.size > MAX) return msg(out, 'حجم المرفق يتجاوز 10 ميغابايت', 'err');
      let type = f.type || (/\.hei[cf]$/i.test(f.name) ? 'image/heic' : '');
      if (!(type === 'application/pdf' || type.startsWith('image/'))) return msg(out, 'المرفق يجب أن يكون PDF أو صورة', 'err');
    }
    btn.disabled = true; msg(out, 'جارٍ الإرسال...');
    try {
      if (f) data.file = { name: f.name, type: f.type || 'image/heic', data: await readFile(f) };
      await call('submitRequest', PASS, data);
      ['name', 'request', 'reason', 'file'].forEach(id => $(id).value = '');
      msg(out, 'تم إرسال طلبك بنجاح ✓', 'ok');
    } catch (e) { msg(out, e, 'err'); }
    btn.disabled = false;
  };

  // ---- Admin ----
  async function loadList() {
    $('count').textContent = 'جارٍ التحميل...';
    try { ROWS = await call('listRequests', PASS); render(); }
    catch (e) { $('count').textContent = e; }
  }
  $('refreshBtn').onclick = loadList;
  $('hideDone').onchange = render;

  function b64ToBlob(d) {
    const bin = atob(d.data), bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new Blob([bytes], { type: d.type });
  }

  function field(label, text) {
    return el('div', { className: 'field' }, el('b', { textContent: label }), el('p', { textContent: text || '—' }));
  }

  function card(r) {
    const c = el('div', { className: 'card' + (r.done ? ' done' : '') });
    const date = new Date(r.date);
    c.append(
      el('div', { className: 'row', style: 'margin-top:0;justify-content:space-between' },
        el('strong', { textContent: r.name }),
        el('span', { className: 'badge', textContent: r.done ? 'تم ✓' : 'جديد' })),
      el('div', { className: 'meta', textContent: isNaN(date) ? r.date : date.toLocaleString('ar-KW') }),
      field('الطلب', r.request),
      field('السبب', r.reason));

    if (r.fileId) {
      const preview = el('div', { className: 'preview' });
      const fmsg = el('span', { className: 'meta' });
      let cached = null;
      const fetchFile = async () => cached || (cached = await call('getFile', PASS, r.id));
      const viewBtn = el('button', { className: 'ghost', textContent: 'عرض' });
      const dlBtn = el('button', { className: 'ghost', textContent: 'تحميل' });
      viewBtn.onclick = async () => {
        viewBtn.disabled = true; fmsg.textContent = 'جارٍ الجلب...';
        try {
          const d = await fetchFile();
          preview.replaceChildren(d.type.startsWith('image/')
            ? el('img', { src: 'data:' + d.type + ';base64,' + d.data, alt: r.fileName })
            : el('a', { href: 'https://drive.google.com/file/d/' + encodeURIComponent(r.fileId) + '/view', target: '_blank', textContent: 'فتح ملف PDF في Drive' }));
          fmsg.textContent = '';
        } catch (e) { fmsg.textContent = e; }
        viewBtn.disabled = false;
      };
      dlBtn.onclick = async () => {
        dlBtn.disabled = true; fmsg.textContent = 'جارٍ التحميل...';
        try {
          const d = await fetchFile();
          const a = el('a', { href: URL.createObjectURL(b64ToBlob(d)), download: r.fileName || d.name });
          document.body.append(a); a.click(); a.remove();
          fmsg.textContent = '';
        } catch (e) { fmsg.textContent = e; }
        dlBtn.disabled = false;
      };
      c.append(el('div', { className: 'field' }, el('b', { textContent: 'المرفق: ' + r.fileName })),
        el('div', { className: 'row', style: 'margin-top:0' }, viewBtn, dlBtn, fmsg), preview);
    }

    const note = el('textarea', { value: r.draft ?? r.note, placeholder: 'ملاحظاتي على هذا الطلب' });
    note.oninput = () => { r.draft = note.value; };
    const nmsg = el('span', { className: 'meta' });
    const saveBtn = el('button', { className: 'ghost', textContent: 'حفظ الملاحظة' });
    saveBtn.onclick = async () => {
      saveBtn.disabled = true;
      try { await call('saveNote', PASS, r.id, note.value); r.note = note.value; r.draft = undefined; nmsg.textContent = 'حُفظت ✓'; }
      catch (e) { nmsg.textContent = e; }
      saveBtn.disabled = false;
    };
    const doneBtn = el('button', { className: r.done ? 'ghost' : 'ok', textContent: r.done ? 'إلغاء الإنجاز' : 'تم ✓' });
    doneBtn.onclick = async () => {
      doneBtn.disabled = true;
      try { await call('setDone', PASS, r.id, !r.done); r.done = !r.done; render(); }
      catch (e) { nmsg.textContent = e; doneBtn.disabled = false; }
    };
    c.append(el('label', { textContent: 'ملاحظاتي' }), note, el('div', { className: 'row' }, saveBtn, doneBtn, nmsg));
    return c;
  }

  function render() {
    const rows = $('hideDone').checked ? ROWS.filter(r => !r.done) : ROWS;
    const open = ROWS.filter(r => !r.done).length;
    $('count').textContent = 'الإجمالي: ' + ROWS.length + ' — غير المنجزة: ' + open;
    $('list').replaceChildren(...(rows.length ? rows.map(card) : [el('div', { className: 'card meta', textContent: 'لا توجد طلبات' })]));
  }
</script>
</body>
</html>
